# seed20210019: 게이트 제거(deletion) 로직 수정 — seed17(실패유형 scout) + windowed deletion.
#   seed17과 프롬프트·아키텍처 전부 동일(26B-A4B, numina train 전체, failure_mode_scout, batch 25).
#   딱 게이트만 바꿈: 단일배치 mcl/lives 면제 → 누적 unique-rate 윈도로 통일(노이즈 삭제 제거).
#   목적: 로스터 크기 limit-cycle 진동(seed17 ~2↔6, 주기~25스텝) 완화 + 멤버십 안정성.
#   비교: seed17(OFF) vs seed19(ON), 프롬프트 무변.
model: "google/gemma-4-26B-A4B-it"
dataset: "numina_cot"
split: "train"
train_size: 62185
epochs: 1
batch_size: 25
max_lives: 5
enable_thinking: false
shared_contribution_exemption: false   # window 모드에선 미사용(누적 윈도가 흡수)
failure_mode_scout: true               # seed17과 동일: 실패유형 scout
# (use_exclusive_solves 없음 → scout는 failure-mode 분기 사용)

# Windowed deletion (게이트 수정 핵심)
deletion_window: 30     # ≈750문제 윈도(batch 25). grace=30스텝.
deletion_floor: 0.0     # 윈도 동안 단독해결 0일 때만 lives 감소(가장 보수적)
delete_cooldown: 15     # 삭제 ≤1회/15스텝 — 연쇄 급락 완충

llm:
  max_model_len: 32768   # failure-mode scout는 하드에러+틀린풀이과정을 한 프롬프트에 모아 길어짐.
  max_tokens: 8192

vllm:
  tp_size: 2
  dtype: bfloat16
  enable_prefix_caching: true
  max_num_seqs: 256
  gpu_memory_utilization: 0.90
  enforce_eager: false
