# seed20210015: numina + scout V1(atomicity), shared 면제 OFF (도태 부활).  (2x2: V1 × shared-OFF)
#   = seed13과 동일하되 scout만 V2→V1. use_exclusive_solves 없음 → scout가 V1(atomicity 규칙) 사용.
#   shared_contribution_exemption: false → WAR=0 에이전트 도태. 백본은 base.yaml(gemma-4-31B-it).
dataset: "numina_cot"
split: "train"
train_size: 300
epochs: 5
batch_size: 50
max_lives: 5
enable_thinking: false
shared_contribution_exemption: false   # OFF → 도태 부활
# (use_exclusive_solves 미설정 → 기본 false → scout V1)

vllm:
  tp_size: 1
  dtype: bfloat16
  enable_prefix_caching: true
  max_num_seqs: 128
  gpu_memory_utilization: 0.90
  enforce_eager: false
