# SNI 진화 seed20212003 — **v6 = soft_linear WAR + 이진 3경로 전면 차단.**
#
# seed20212002(v5)에서 바뀐 것은 둘.
#
# (1) war_mode: soft_linear  ← ★ seed20212001·2002는 이 키가 없어서 기본값 "hard"로
#     떨어져 있었다(run_evolution.py: cfg.get("war_mode", "hard")). 두 판 모두 적합도가
#     "정확히 나만 푼 문제 수"였다는 뜻이고, 이진에서 남들과 반대로 찍으면 그 카운트가
#     그대로 오르는 눈금이었다. soft_linear는 내가 푼 문제 i마다 (E-n_i)/(E-1)점 —
#     E=로스터 총원, n_i=그 문제를 푼 사람 수. 혼자 풀면 1.0, 전원이 풀면 0.0으로
#     양 끝은 hard와 같고 가운데를 채운다(E=9에서 4명이 풀면 각자 0.625).
#     soft_partial(ROUGE 부분점수)은 쓰지 않는다 — 사용자 결정.
#
# (2) exclude_binary: true — 이진(n_gold_types==2)을 세 경로 **전부**에서 뺀다.
#     v5는 A만 막았고 실패했다. 정보를 막아도 "반대로 답하라"는 아무 하드에러에서나
#     나올 수 있는 일반 전략이라, 보상 경로가 열려 있으면 재발명된다
#     (v5 실측: 단독해결 874건 중 634건 72.5%가 2지선다, lift 2.02. 밀도는 오히려
#      1.16/스텝으로 20212001의 0.71/스텝보다 높아졌다).
#       A 스카우트 입력  — hard error 텍스트에서 제외 (v5와 동일)
#       B 승인 게이트    — probe/new_pass_on_union/니치 회수 판정에서 제외
#       C 적합도         — WAR·lives·삭제·exclusive_solves 기록에서 제외
#     ⚠️ UB(upper_bound_rate)는 배치 전체 기준을 유지한다 — 20212001/2002와 비교할
#        보고 수치라 정의를 바꾸면 안 된다. 바뀌는 건 선택압뿐이다.
#     대가: 진화 로그에 남는 비교 대상(최소 1명이 푼 문제)의 35.9%가 선택압에서 빠진다.
#
# 이하 seed20212002 주석 그대로.
#
# 데이터: export/sni_v4 (job 232072). v3에서 바뀐 것 —
#   · answer_line 제거 → 프롬프트가 공식 Tk-Instruct 그대로
#     (system = 페르소나 + definition / user = pos example 2건 + "Now complete..." + Input/Output:)
#   · 컨텍스트 16,384 초과 103건 제외. 이 값은 **실제 프롬프트로 다시 잰 것**이다 —
#     v3까지의 61건은 sni_context_filter가 pos example을 빼고 조립해 과소평가한 값이었다.
#   · train/valid/test = 8:1:1 인스턴스 단위 무작위 분할(seed 42). 같은 task의 인스턴스가
#     분할을 가로지른다 — test는 미접촉 "문제"이지 미접촉 "태스크"가 아니다. 판독 때 살릴 것.
#   공개본: https://huggingface.co/datasets/Kcsp0042/SNI_split
#
# batch_size 50 — 캘리브레이션 프로브(job 232084, v4 프롬프트 실측)로 정했다.
#   하드에러: luca 단독 45.3%(배치당 23건) → 태스크축 12명 37.1%(19건).
#   few-shot 2건이 v2 대비 2~5%p 낮췄지만 스카우트 표본으로는 충분하다.
#   seed18(batch 100, 하드에러 평균 21.2건)과 같은 작동점이다.
#   ⚠️ acc의 선택압 고갈(배치당 0.5건)과는 상황이 정반대다.
#
# max_tokens 128 — 공식 --max_target_length와 동일. 전수 gold 토큰 p99 = 97.
#   4096에서 128로 자를 때 EM 손실 상한은 실측 0.28%p(435,140건 표본)라 안전하다.
model: "google/gemma-4-26B-A4B-it"
dataset: "sni"
data_dir: "export/sni_v4"
split: "train"          # 파일 자체가 8:1:1의 train. 홀드아웃은 sni_valid/sni_test에 따로 있다
train_size: 69588       # sni_train.jsonl 전량 → run_evolution 내부 홀드아웃은 0(의도된 것)
epochs: 1
batch_size: 50
max_lives: 5
enable_thinking: false
shared_contribution_exemption: false   # window 모드에선 미사용(누적 윈도가 흡수)
roster_init_path: "configs/roster_init.json"   # LUCA 단독 = 프로브의 45.3% 시작점

# v6 — 적합도 눈금
war_mode: "soft_linear"

# v6 — 이진 라벨 3경로 전면 차단 (A 스카우트 · B 게이트 · C 적합도)
exclude_binary: true

# Windowed deletion — seed18 표준. window만 batch에 맞춰 조정한다.
deletion_window: 16     # seed18의 8은 batch 100 기준(=800문제). batch 50에서 같은 폭이 되려면 16.
deletion_floor: 0.0     # 윈도 동안 단독해결 0일 때만 lives 감소(가장 보수적)
delete_cooldown: 5      # 삭제 ≤1회/5스텝 — 연쇄 급락 완충

llm:
  # 데이터는 이미 16,384 초과분을 export 단계에서 제외했으므로 남은 문제는 전부 그 아래다.
  # 그런데 16,384로 딱 맞춰 뒀다가 seed20212001이 step 617에서 터졌다 — 제외 목록을 잰 뒤
  # 진화가 더 긴 페르소나를 만들어, 경계에 붙어 있던 문제가 밀려 넘어갔다.
  # 32,768이면 데이터 상한 위로 16,384토큰이 남아 페르소나가 얼마가 되든 안 걸린다.
  max_model_len: 32768
  max_tokens: 128

vllm:
  tp_size: 2
  dtype: bfloat16
  enable_prefix_caching: true
  max_num_seqs: 256
  gpu_memory_utilization: 0.90
  enforce_eager: false
