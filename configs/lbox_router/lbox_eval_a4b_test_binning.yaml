# Reproduce the pre-SFT evolved-roster labeling protocol on the LBox test split.
model: "google/gemma-4-26B-A4B-it"
dataset: "lbox"
data_dir: "export/lbox"
split: "test"
enable_thinking: false
max_prompt_chars: 12000

llm:
  max_model_len: 16384
  max_tokens: 2048

vllm:
  tp_size: 1
  dtype: bfloat16
  enable_prefix_caching: true
  max_num_seqs: 256
  gpu_memory_utilization: 0.90
  enforce_eager: false
