# QASC eval config — validation split, 1 GPU(tp=1), answer-letter generation.
model: "google/gemma-4-26B-A4B-it"
dataset: "qasc"
data_dir: "export/qasc"
split: "validation"
enable_thinking: false

llm:
  max_model_len: 16384
  max_tokens: 1024

vllm:
  tp_size: 1
  dtype: bfloat16
  enable_prefix_caching: true
  max_num_seqs: 256
  gpu_memory_utilization: 0.90
  enforce_eager: false
