# Base evolution hyperparameters (override via CLI or per-dataset YAML)

model: "google/gemma-4-31B-it"

llm:
  max_model_len: 16384
  max_tokens: 8192
  sampling:
    temperature: 1.0
    top_p: 0.95
    top_k: 64
    repetition_penalty: 1.05

vllm:
  tp_size: 1
  dtype: bfloat16
  enable_prefix_caching: true
  max_num_seqs: 64
  gpu_memory_utilization: 0.90
  enforce_eager: false

data_dir: "/home/jaehoonjeong/data/MultiAgent/Data"
split: "test"
roster_path: "results/gm_roster_v8.json"
roster_init_path: "configs/roster_init.json"
batch_size: 50
train_size: 100
epochs: 6
# Self-refine baseline only; one-step evolution/inference do not use critic-refine loops
max_refine_iters: 2
infer_batch_size: 64

# WAR / eviction
war_tiebreak: "random"  # random | alphabetical — avoid systematic bias
max_lives: 3

# Action gate
action_gate:
  lambda_size: 0.05
  scale: 0.25

# Scoring
lcb_timeout: 10
lcb_release_version: "release_v5"
code_exec_timeout: 3

# Run identity (filled by driver)
seed: 42
dataset: "livecodebench"
