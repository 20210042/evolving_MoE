# Base evolution hyperparameters (override via CLI or per-dataset YAML)

model: "google/gemma-4-31B-it"

llm:
  max_model_len: 16384
  max_tokens: 8192
  sampling:
    temperature: 1.0
    top_p: 0.95
    top_k: 64
    repetition_penalty: 1.05

vllm:
  tp_size: 4
  dtype: bfloat16
  enable_prefix_caching: true
  max_num_seqs: 128
  gpu_memory_utilization: 0.90
  enforce_eager: false

data_dir: "/home/jaehoonjeong/data/MultiAgent/Data"
split: "test"
roster_path: "results/gm_roster_v8.json"
roster_init_path: "configs/roster_init.json"
batch_size: 50
train_size: 100
epochs: 6
# Self-refine baseline only; one-step evolution/inference do not use critic-refine loops
max_refine_iters: 2
infer_batch_size: 64

# WAR / eviction
war_tiebreak: "random"  # random | alphabetical — avoid systematic bias
max_lives: 3
# Windowed deletion (0 = OFF = legacy single-batch mcl + lives exemptions). When
# >0, the whole removal path (lives eligibility, worst ordering, delete trigger)
# keys off one accumulated unique-solve rate over the last `deletion_window`
# batches; an agent's lives decay only on a sustained rate <= deletion_floor.
# delete_cooldown rate-limits deletes (≤1 per K steps) to damp cascade collapse.
deletion_window: 0
deletion_floor: 0.0
delete_cooldown: 0
# Saturated run: disable Phase-2 (delete/swap) → add-or-noop only. Roster grows
# monotonically until the exponential add-size penalty stalls it (fixed-point superset).
add_only: false

# Action gate
action_gate:
  lambda_size: 0.05
  scale: 0.25

# Scoring
lcb_timeout: 10
lcb_release_version: "release_v5"
code_exec_timeout: 3

# Run identity (filled by driver)
seed: 42
dataset: "livecodebench"
