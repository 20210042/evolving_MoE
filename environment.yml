name: evolving_moe
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
      # inference (Gemma-4 backbone)
      - vllm==0.11.0
      - torch==2.8.0
      - transformers==4.57.6
      - accelerate==1.10.1
      # training
      - peft
      - trl
      # data
      - datasets==4.4.1
      - pandas==2.3.0
      - numpy==1.26.3
      # utils
      - pyyaml==6.0.3
      - wandb==0.23.0
      # dev
      - pytest==8.4.2
      # evaluate
      - math-verify==0.9.0
