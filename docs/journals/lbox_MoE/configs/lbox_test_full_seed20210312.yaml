# seed20210312: LBox Open Phase 1 full-test evolution over all 8,203 test examples.
# This intentionally evolves on the labeled test split; keep its outputs separate
# from held-out test evaluation results.
model: "google/gemma-4-26B-A4B-it"
dataset: "lbox"
data_dir: "export/lbox"
split: "test"
train_size: 8203
epochs: 1
batch_size: 50
max_lives: 5
enable_thinking: false
shared_contribution_exemption: false
roster_init_path: "configs/roster_init.json"
max_prompt_chars: 12000

deletion_window: 16
deletion_floor: 0.0
delete_cooldown: 8

llm:
  max_model_len: 16384
  max_tokens: 2048

vllm:
  tp_size: 1
  dtype: bfloat16
  enable_prefix_caching: true
  max_num_seqs: 256
  gpu_memory_utilization: 0.90
  enforce_eager: false
