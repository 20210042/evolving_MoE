name: MoE_mergoo
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10.20
  - pip
  - pip:
      # Mergoo 0.0.10 uses older Hugging Face internals. This pin is new
      # enough for Llama 3.1 rope_scaling and still keeps shard_checkpoint.
      - mergoo==0.0.10
      - transformers==4.43.4
      - accelerate==0.27.2
      - peft==0.9.0
      - trl==0.7.11
      - huggingface-hub==0.36.2
      - tokenizers==0.19.1
      - safetensors==0.4.2
      - tqdm==4.66.2
      - sentencepiece
      - protobuf

      # Runtime / training utilities used by this repo. For faster setup on
      # this cluster, prefer the clone + overlay workflow documented in
      # docs/mergoo_environment.md so torch can be inherited from MoE.
      - torch==2.11.0
      - datasets==2.18.0
      - pandas==2.2.3
      - numpy==1.26.4
      - pyyaml==6.0.3
      - wandb==0.23.0
      - math-verify==0.9.0
      - openai
      - python-dotenv
      - pytest==8.4.2
